services:
  type: web
  name: sentinel-fraud-api
  env: python
  rootDir: fraud-detection-system
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
  plan: free
  envVars:
- key: PYTHON_VERSION
   value: 3.11.0
- key: MODEL_PATH
value: models/fraud_model.joblib
